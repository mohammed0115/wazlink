  "components": {
    "securitySchemes": {
      "sessionAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "sessionid",
        "description": "Django session cookie. Unsafe requests also require CSRF token."
      }
    },
    "schemas": {
      "Money": {
        "type": "object",
        "description": "Decimal money amount with ISO currency.",
        "additionalProperties": false,
        "properties": {
          "amount": {
            "type": "string",
            "pattern": "^-?\\d+(\\.\\d{1,4})?$",
            "description": "Decimal string; never a binary float."
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$",
            "description": "Authoritative ISO-4217 currency code for amount."
          }
        },
        "required": [
          "amount",
          "currency"
        ]
      },
      "PageInfo": {
        "type": "object",
        "description": "Cursor pagination metadata.",
        "additionalProperties": false,
        "properties": {
          "next_cursor": {
            "type": "string",
            "nullable": true
          },
          "has_next": {
            "type": "boolean"
          }
        },
        "required": [
          "next_cursor",
          "has_next"
        ]
      },
      "EntityRef": {
        "type": "object",
        "description": "Stable public entity reference.",
        "additionalProperties": false,
        "properties": {
          "public_id": {
            "type": "string",
            "description": "Public contract string"
          },
          "entity_type": {
            "type": "string",
            "description": "Public contract string"
          }
        },
        "required": [
          "public_id",
          "entity_type"
        ]
      },
      "ErrorDetail": {
        "type": "object",
        "description": "Safe machine-readable error detail.",
        "additionalProperties": false,
        "properties": {
          "field": {
            "type": "string",
            "description": "Public contract string",
            "nullable": true
          },
          "reason": {
            "type": "string",
            "description": "Public contract string",
            "nullable": true
          }
        }
      },
      "ErrorEnvelope": {
        "type": "object",
        "description": "Safe error envelope; never exposes stack traces or secrets.",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "description": "Error payload.",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "description": "Public contract string"
              },
              "message": {
                "type": "string",
                "description": "Public contract string"
              },
              "details": {
                "type": "object"
              },
              "request_id": {
                "type": "string",
                "description": "Public contract string"
              }
            },
            "required": [
              "code",
              "message",
              "details",
              "request_id"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "Session": {
        "type": "object",
        "description": "Authenticated Django session response.",
        "additionalProperties": false,
        "properties": {
          "session_id": {
            "type": "string",
            "description": "Public contract string"
          },
          "user": {
            "$ref": "#/components/schemas/EntityRef"
          },
          "workspace_ref": {
            "$ref": "#/components/schemas/EntityRef"
          },
