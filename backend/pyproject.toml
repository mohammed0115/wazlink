[project]
name = "wazlink-backend"
version = "0.1.0"
description = "WazLink backend — B14 implementation master pack, Wave 1"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.17,<6.0",
    "djangorestframework>=3.18.0",
    "psycopg[binary,pool]>=3.3.0",
    "celery>=5.6.3",
    "redis>=6.0.0",
    "django-cors-headers>=4.9.0",
    "dj-database-url>=3.0.0",
    "python-dotenv>=1.1.0",
    "whitenoise>=6.11.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "common*", "apps*", "adapters*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "apps"]
markers = [
    "security: security regression suite — permanent gate",
    "nc: negative control — must be collected and non-empty",
    "e2e: end-to-end wave integration test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
